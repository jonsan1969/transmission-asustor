name: Modern ABI Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Pull manylinux2014 x86-64 build environment
        run: docker pull quay.io/pypa/manylinux2014_x86_64

      - name: Probe modern compiler and glibc baseline
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/bash -lc '
              set -euxo pipefail

              echo "=== BASE SYSTEM ==="
              cat /etc/os-release || true
              /lib64/libc.so.6 | head -1 || true

              echo "=== AVAILABLE DEVTOOLSETS ==="
              ls -d /opt/rh/devtoolset-* 2>/dev/null || true

              if [ -f /opt/rh/devtoolset-10/enable ]; then
                source /opt/rh/devtoolset-10/enable
              else
                DTS=$(ls -d /opt/rh/devtoolset-* 2>/dev/null | sort | tail -1 || true)
                if [ -n "$DTS" ] && [ -f "$DTS/enable" ]; then
                  source "$DTS/enable"
                fi
              fi

              echo "=== COMPILER ==="
              gcc --version | head -1
              g++ --version | head -1
              gcc -dumpmachine

              cat >/tmp/cxx17.cpp <<"EOF"
              #include <iostream>
              #include <optional>
              #include <string_view>
              #include <filesystem>

              int main()
              {
                  std::optional<int> value = 41;
                  std::string_view text = "ASUSTOR modern ABI probe";
                  std::filesystem::path p{"/tmp"};
                  std::cout << text << " " << (*value + 1) << " " << p.string() << "\\n";
                  return 0;
              }
              EOF

              echo "=== BUILD C++17 ==="
              g++ -std=c++17 -O2 -march=x86-64 -mtune=generic \
                /tmp/cxx17.cpp -o /tmp/cxx17-probe

              echo "=== ELF ==="
              file /tmp/cxx17-probe
              readelf -l /tmp/cxx17-probe | grep -F "Requesting program interpreter" || true

              echo "=== GLIBC REQUIREMENTS ==="
              readelf -V /tmp/cxx17-probe | grep -o "GLIBC_[0-9.]*" | sort -Vu || true

              echo "=== GLIBCXX REQUIREMENTS ==="
              readelf -V /tmp/cxx17-probe | grep -o "GLIBCXX_[0-9.]*" | sort -Vu || true

              echo "=== NEEDED LIBRARIES ==="
              readelf -d /tmp/cxx17-probe | grep NEEDED || true

              echo "=== RUN TEST ==="
              /tmp/cxx17-probe

              echo "=== CMAKE ==="
              cmake --version | head -1 || true
            '
