name: Build Transmission 4.1.1 for ASUSTOR x86-64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - scripts/build-transmission-standalone.sh
      - scripts/build-transmission-source-rpc.sh
      - scripts/finalize-transmission-release.sh
      - scripts/prepare-apkg-payload.sh
      - scripts/build-asustor-apk.sh
      - package/CONTROL/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Restore original Matt legacy ADM icons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf /tmp/adm-icon-recovery
          mkdir -p /tmp/adm-icon-recovery/artifact /tmp/adm-icon-recovery/apk /tmp/adm-icon-recovery/control
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jonsan1969/transmission-asustor/actions/artifacts/9245772467/zip \
            -o /tmp/adm-icon-recovery/artifact.zip
          unzip -q /tmp/adm-icon-recovery/artifact.zip -d /tmp/adm-icon-recovery/artifact
          unzip -q /tmp/adm-icon-recovery/artifact/transmission_4.1.1_x86-64.apk -d /tmp/adm-icon-recovery/apk
          tar -xzf /tmp/adm-icon-recovery/apk/control.tar.gz -C /tmp/adm-icon-recovery/control
          cp /tmp/adm-icon-recovery/control/icon.png package/CONTROL/icon.png
          cp /tmp/adm-icon-recovery/control/icon-enable.png package/CONTROL/icon-enable.png
          cp /tmp/adm-icon-recovery/control/icon-disable.png package/CONTROL/icon-disable.png
          test "$(sha256sum package/CONTROL/icon.png | awk '{print $1}')" = 9b08828efa4b7cae7e8329038b363aec397738060f973081898b5ce65b4e7690
          test "$(sha256sum package/CONTROL/icon-enable.png | awk '{print $1}')" = 9b08828efa4b7cae7e8329038b363aec397738060f973081898b5ce65b4e7690
          test "$(sha256sum package/CONTROL/icon-disable.png | awk '{print $1}')" = fcc419d0b67c8cea0808c9a696af037067e796e298122ca0b8a3cb52608030b3
          if ! git diff --quiet -- package/CONTROL/icon.png package/CONTROL/icon-enable.png package/CONTROL/icon-disable.png; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package/CONTROL/icon.png package/CONTROL/icon-enable.png package/CONTROL/icon-disable.png
            git commit -m "Restore original Matt legacy ADM icons"
            git push origin HEAD:main
          fi

      - name: Pull pinned manylinux2014 build environment
        run: docker pull quay.io/pypa/manylinux2014_x86_64@sha256:0a42cb7e5f4ba6bbfb8d0a86d1aab0c8876ba9c3be16bd99360ae42bf010ec77

      - name: Build, audit, finalize and prepare APKG payload
        run: |
          set -euxo pipefail
          chmod +x scripts/build-transmission-standalone.sh scripts/build-transmission-source-rpc.sh scripts/finalize-transmission-release.sh scripts/prepare-apkg-payload.sh
          docker run --rm \
            -e MANPATH="" \
            -v "$PWD:/work" \
            -w /work \
            quay.io/pypa/manylinux2014_x86_64@sha256:0a42cb7e5f4ba6bbfb8d0a86d1aab0c8876ba9c3be16bd99360ae42bf010ec77 \
            /bin/bash -lc '/work/scripts/build-transmission-source-rpc.sh && /work/scripts/finalize-transmission-release.sh && /work/scripts/prepare-apkg-payload.sh'

      - name: Build and validate native ASUSTOR APK
        run: |
          set -euxo pipefail
          chmod +x scripts/build-asustor-apk.sh
          sudo env ROOT="$PWD" PAYLOAD="$PWD/out/transmission-apkg-payload" CONTROL_SRC="$PWD/package/CONTROL" scripts/build-asustor-apk.sh
          sudo chown "$USER:$USER" transmission_4.1.1_x86-64.apk asustor-apk-check.txt

      - name: Upload ASUSTOR x86-64 golden standalone bundle
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: transmission-4.1.1-asustor-x86_64-glibc217
          path: transmission-standalone.tar.gz
          if-no-files-found: error

      - name: Upload minimal APKG payload
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: transmission-4.1.1-asustor-x86_64-apkg-payload
          path: transmission-apkg-payload.tar.gz
          if-no-files-found: error

      - name: Upload native ASUSTOR APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: transmission-4.1.1-asustor-x86_64-apk
          path: transmission_4.1.1_x86-64.apk
          if-no-files-found: error

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transmission-asustor-x86_64-runtime-check
          path: standalone-runtime-check.txt
          if-no-files-found: warn

      - name: Upload ABI audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transmission-asustor-x86_64-abi-audit
          path: standalone-abi-audit.txt
          if-no-files-found: warn

      - name: Upload release finalization diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transmission-asustor-x86_64-release-check
          path: standalone-release-check.txt
          if-no-files-found: warn

      - name: Upload APKG payload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transmission-asustor-x86_64-apkg-payload-check
          path: apkg-payload-check.txt
          if-no-files-found: warn

      - name: Upload native APK diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transmission-asustor-x86_64-apk-check
          path: asustor-apk-check.txt
          if-no-files-found: warn
