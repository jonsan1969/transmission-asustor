name: Transmission 4.1.1 Build Probe

on:
  workflow_dispatch:

jobs:
  build-probe:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Pull pinned manylinux2014 build environment
        run: docker pull quay.io/pypa/manylinux2014_x86_64@sha256:0a42cb7e5f4ba6bbfb8d0a86d1aab0c8876ba9c3be16bd99360ae42bf010ec77

      - name: Build OpenSSL, curl and Transmission 4.1.1, then audit ABI
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            quay.io/pypa/manylinux2014_x86_64@sha256:0a42cb7e5f4ba6bbfb8d0a86d1aab0c8876ba9c3be16bd99360ae42bf010ec77 \
            /bin/bash -lc '
              set -eo pipefail
              export MANPATH="${MANPATH:-}"
              source /opt/rh/devtoolset-10/enable
              set -ux

              OPENSSL_VERSION=3.5.7
              CURL_VERSION=8.21.0
              PREFIX=/opt/transmission-deps

              export CFLAGS="-O2 -march=x86-64 -mtune=generic"
              export CXXFLAGS="-O2 -march=x86-64 -mtune=generic"
              export PKG_CONFIG_PATH="$PREFIX/lib64/pkgconfig:$PREFIX/lib/pkgconfig"
              export PATH="$PREFIX/bin:$PATH"
              export LD_LIBRARY_PATH="$PREFIX/lib64:$PREFIX/lib:${LD_LIBRARY_PATH:-}"

              echo "=== BUILD ENVIRONMENT ==="
              gcc --version | head -1
              g++ --version | head -1
              cmake --version | head -1
              /lib64/libc.so.6 | head -1 || true

              echo "=== INSTALL BUILD PREREQUISITES ==="
              yum -y install perl-IPC-Cmd perl-Time-Piece
              perl -MIPC::Cmd -e "print qq(IPC::Cmd OK\n)"
              perl -MTime::Piece -e "print qq(Time::Piece OK\n)"

              echo "=== BUILD OPENSSL $OPENSSL_VERSION ==="
              rm -rf /tmp/openssl-src /tmp/openssl.tar.gz "$PREFIX"
              mkdir -p "$PREFIX"
              curl -L --fail --retry 3 \
                -o /tmp/openssl.tar.gz \
                "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
              mkdir /tmp/openssl-src
              tar -xzf /tmp/openssl.tar.gz -C /tmp/openssl-src --strip-components=1
              cd /tmp/openssl-src
              ./Configure linux-x86_64 shared no-tests no-docs \
                --prefix="$PREFIX" \
                --openssldir="$PREFIX/ssl"
              make -j"$(nproc)"
              make install_sw install_ssldirs

              echo "=== OPENSSL RESULT ==="
              find "$PREFIX" -maxdepth 2 \( -name "libssl.so*" -o -name "libcrypto.so*" \) -print | sort
              readelf -d "$PREFIX/bin/openssl" | grep -E "NEEDED|RPATH|RUNPATH" || true
              "$PREFIX/bin/openssl" version -a

              echo "=== BUILD CURL $CURL_VERSION ==="
              rm -rf /tmp/curl-src /tmp/curl.tar.xz
              curl -L --fail --retry 3 \
                -o /tmp/curl.tar.xz \
                "https://curl.se/download/curl-$CURL_VERSION.tar.xz"
              mkdir /tmp/curl-src
              tar -xJf /tmp/curl.tar.xz -C /tmp/curl-src --strip-components=1
              cd /tmp/curl-src
              LDFLAGS="-L$PREFIX/lib64 -L$PREFIX/lib" \
              CPPFLAGS="-I$PREFIX/include" \
              ./configure \
                --prefix="$PREFIX" \
                --with-openssl="$PREFIX" \
                --enable-shared \
                --disable-static \
                --disable-ldap \
                --disable-ldaps \
                --without-libpsl \
                --without-zlib \
                --without-brotli \
                --without-zstd \
                --without-libidn2 \
                --without-nghttp2 \
                --without-nghttp3 \
                --without-ngtcp2 \
                --without-libssh2
              make -j"$(nproc)"
              make install

              echo "=== CURL RESULT ==="
              "$PREFIX/bin/curl" --version
              find "$PREFIX" -maxdepth 2 -type f -name "libcurl.so*" | sort

              echo "=== FETCH TRANSMISSION 4.1.1 ==="
              rm -rf /tmp/transmission-src /tmp/transmission-build
              git clone --depth 1 --branch 4.1.1 --recurse-submodules \
                https://github.com/transmission/transmission.git /tmp/transmission-src

              echo "=== PATCH GCC 10 CONSTEXPR COMPATIBILITY ==="
              grep -q "constexpr bool is_ipv6_6to4() const noexcept" /tmp/transmission-src/libtransmission/net.h
              sed -i "/is_ipv6_6to4() const noexcept/s/constexpr //" /tmp/transmission-src/libtransmission/net.h
              grep -n -B2 -A3 "is_ipv6_6to4" /tmp/transmission-src/libtransmission/net.h

              echo "=== CONFIGURE MINIMAL DAEMON BUILD ==="
              cmake -S /tmp/transmission-src -B /tmp/transmission-build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$PREFIX" \
                -DCMAKE_C_STANDARD=11 \
                -DCMAKE_CXX_STANDARD=17 \
                -DCMAKE_C_FLAGS="$CFLAGS" \
                -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
                -DCURL_INCLUDE_DIR="$PREFIX/include" \
                -DCURL_LIBRARY="$PREFIX/lib/libcurl.so" \
                -DOPENSSL_ROOT_DIR="$PREFIX" \
                -DOPENSSL_USE_STATIC_LIBS=FALSE \
                -DENABLE_DAEMON=ON \
                -DENABLE_CLI=ON \
                -DENABLE_UTILS=ON \
                -DENABLE_GTK=OFF \
                -DENABLE_QT=OFF \
                -DENABLE_MAC=OFF \
                -DENABLE_TESTS=OFF \
                -DENABLE_NLS=OFF \
                -DINSTALL_DOC=OFF \
                -DINSTALL_LIB=OFF \
                -DREBUILD_WEB=OFF \
                -DINSTALL_WEB=ON \
                -DWITH_SYSTEMD=OFF \
                -DWITH_CRYPTO=openssl

              echo "=== CONFIGURE SUCCEEDED ==="
              cmake -LA -N /tmp/transmission-build | grep -E "^(CMAKE_|CURL_|OPENSSL_|ENABLE_|INSTALL_|USE_SYSTEM_|WITH_)" | sort || true

              echo "=== BUILD TRANSMISSION 4.1.1 ==="
              cmake --build /tmp/transmission-build --parallel "$(nproc)"

              echo "=== TRANSMISSION BINARIES ==="
              find /tmp/transmission-build -type f -name "transmission-*" -perm /111 -print | sort

              echo "=== VERSION SMOKE TEST ==="
              DAEMON=$(find /tmp/transmission-build -type f -name "transmission-daemon" -perm /111 | head -1)
              test -n "$DAEMON"
              "$DAEMON" --version

              echo "=== ELF ABI AUDIT: TRANSMISSION EXECUTABLES ==="
              while IFS= read -r elf; do
                if file "$elf" | grep -q "ELF 64-bit"; then
                  echo "--- $elf ---"
                  file "$elf"
                  readelf -l "$elf" | grep "Requesting program interpreter" || true
                  readelf -d "$elf" | grep -E "NEEDED|RPATH|RUNPATH" || true
                  echo "max GLIBC:    $(strings "$elf" | grep -oE "GLIBC_[0-9.]+" | sort -V | tail -1 || true)"
                  echo "max GLIBCXX:  $(strings "$elf" | grep -oE "GLIBCXX_[0-9.]+" | sort -V | tail -1 || true)"
                  echo "max CXXABI:   $(strings "$elf" | grep -oE "CXXABI_[0-9.]+" | sort -V | tail -1 || true)"
                fi
              done < <(find /tmp/transmission-build -type f -name "transmission-*" -perm /111 | sort)

              echo "=== ELF ABI AUDIT: PRIVATE DEPENDENCIES ==="
              while IFS= read -r elf; do
                if file "$elf" | grep -q "ELF 64-bit"; then
                  echo "--- $elf ---"
                  file "$elf"
                  readelf -d "$elf" | grep -E "NEEDED|RPATH|RUNPATH" || true
                  echo "max GLIBC:    $(strings "$elf" | grep -oE "GLIBC_[0-9.]+" | sort -V | tail -1 || true)"
                  echo "max GLIBCXX:  $(strings "$elf" | grep -oE "GLIBCXX_[0-9.]+" | sort -V | tail -1 || true)"
                  echo "max CXXABI:   $(strings "$elf" | grep -oE "CXXABI_[0-9.]+" | sort -V | tail -1 || true)"
                fi
              done < <(find "$PREFIX/lib" "$PREFIX/lib64" -maxdepth 1 -type f \( -name "*.so" -o -name "*.so.*" \) 2>/dev/null | sort)

              echo "=== BUILD + ABI AUDIT SUCCEEDED ==="
            '
